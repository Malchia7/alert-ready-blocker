name: Update BC Alert Ready test calendar

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for upcoming tests
        run: python check_for_upcoming_tests.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bc-alert-test.ics; then
            git add bc-alert-test.ics
            git commit -m "Update bc-alert-test.ics"
            git push
          else
            echo "No changes to bc-alert-test.ics"
          fi
